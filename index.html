<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
   <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Your Local aframe-ar -->
  <script src="./aframe-ar-main/dist/aframe-ar.min.js"></script>
</head>
<body>
  <script>
    function showMessage(message){
      let hud = document.querySelector("#hud")
       if(hud){
          hud.setAttribute('value', message);
        }
    }
    AFRAME.registerComponent('ar-logic',{
      init: function(){
        showMessage('ar-logic is working')
      },
      tick: function(){
        let cam= document.querySelector("cam");
        if(!cam || !cam.components.raycaster){
          return;
        }
        let intersection = cam.components.raycaster.getIntersection(document.querySelector("#circle"));
        if(!intersection){
          return;
        }
        showMessage('Collision detected' + intersection.point.x.toFixed(2) + " " + intersection.point.z.toFixed(2));
        let circle = document.querySelector("#circle");
        circle.setAttribute('postion', intersection.point);
      }

    });
    window.addEventListener('touchstart',function(){
      let box= doucument.querySelector("#box");
      let circle= document.querySelector("circle");
      let pos= circle.getAttribute('position');
      box.setAttribute('position',pos);
    });
  </script>
  <a-scene ar ar-logic>
    <a-camera id = "cam" raycaster = "objects:none">
      <a-text id="hud"
        value="poda"
        position="0 -0.1 -0.25"
        allign="center"
        wrap-count="800"
    ></a-text>
    </a-camera>
    <a-ring
      id="circle"
      rotation="-90 0 0"
      inner-radius="0.01"
      outer-radius="0.02"
    ></a-ring>
    <a-gltf id="box"
      src="model/arCar.glb"
      scale="5 5 5"
      position="0 0 0"
    ></a-gltf>
    
  </a-scene>
  
</body>
</html>
